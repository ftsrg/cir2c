# cir2c pins a released LLVM tag rather than tracking upstream main, so nothing
# breaks unannounced — but nothing tells us a new release exists either. This
# job does: it compares llvm-version.txt against upstream's tags weekly and
# opens (or updates) a single issue when a newer release is out.
#
# See the "LLVM toolchain" section of README.md for the update procedure.

name: Check for a newer LLVM release

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare the pin against upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the newest upstream release
        id: check
        run: |
          set -euo pipefail
          PIN=$(grep -vE '^[[:space:]]*(#|$)' llvm-version.txt | head -n1 | tr -d '[:space:]')

          # Stable release tags only: llvmorg-<major>.<minor>.<patch>, no -rcN,
          # no -init.
          LATEST=$(git ls-remote --tags --refs https://github.com/llvm/llvm-project.git \
                     'refs/tags/llvmorg-*' \
                   | awk '{print $2}' | sed 's|refs/tags/||' \
                   | grep -E '^llvmorg-[0-9]+\.[0-9]+\.[0-9]+$' \
                   | sort -V | tail -n1)

          echo "pin=$PIN"       >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Pinned: $PIN    Latest upstream: $LATEST"

          if [ "$PIN" = "$LATEST" ]; then
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the tracking issue
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIN: ${{ steps.check.outputs.pin }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          TITLE="Update the pinned LLVM release"
          BODY=$(cat <<EOF
          A newer LLVM release is available.

          | | |
          |---|---|
          | Pinned in \`llvm-version.txt\` | \`${PIN}\` |
          | Newest upstream release | \`${LATEST}\` |

          Updating is deliberate work, not automatic — see
          [README.md](../blob/main/README.md#64-change-the-pin):

          1. Set \`llvm-version.txt\` to \`${LATEST}\`.
          2. Run the **LLVM toolchain image** workflow to rebuild the toolchain.
          3. Build cir2c against it and run the corpus suites.
          4. Fix renamed accessors and changed assembly syntax in the same PR.
          5. Raise \`CIR2C_LLVM_MIN_VERSION\` if the new release drops something.

          _Opened automatically by the weekly LLVM release check._
          EOF
          )

          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" \
                       --json number,title \
                       --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open; refreshing it."
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
