# Builds and publishes ghcr.io/ftsrg/cir2c-llvm — the ClangIR toolchain every
# other workflow builds on top of.
#
# This is the expensive one (a full static LLVM+Clang+MLIR build, hours), so it
# runs only when the pinned revision or the build recipe changes, or on demand.
# Everything else reuses the published image.
#
# The image is published under the pinned revision as its tag. CI and Release
# pull that tag, so they cannot run against a toolchain other than the one their
# commit pins; while this build is in flight they defer, and its completion
# triggers them. That means this workflow must succeed once before CI and
# Release can produce a result at all — including after every pin bump.

name: LLVM toolchain image

on:
  push:
    branches: [main]
    paths:
      - 'llvm-version.txt'
      - 'docker/build-llvm.sh'
      - 'docker/llvm.Dockerfile'
      - '.github/workflows/llvm-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Extra tag to publish alongside `latest`
        required: false
        default: ''

concurrency:
  # One run for each workflow, branch and event. A new run cancels the run that
  # it makes obsolete, so no job continues for a commit that is already old.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    # A full LLVM build does not fit in the default 6 h budget on every runner
    # generation; give it room rather than losing hours to a timeout.
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # A static LLVM build needs far more room than a stock runner has spare.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          PIN=$(grep -vE '^[[:space:]]*(#|$)' llvm-version.txt | head -n1 | tr -d '[:space:]')
          REPO="ghcr.io/${{ github.repository_owner }}/cir2c-llvm"

          # The revision tag is what CI and Release pull: it names the exact
          # toolchain a commit pins, so a run either finds it or waits for it.
          TAGS="$REPO:$PIN"

          # `latest` is a convenience pointer for people, and only main may move
          # it. Dispatching this workflow on a branch (the way a pin bump is
          # prepared) must publish that branch's toolchain without repointing
          # what everyone else pulls by default.
          if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            TAGS="$TAGS,$REPO:latest"
          else
            echo "Not on the default branch: publishing $PIN only, leaving latest alone."
          fi

          if [ -n "${{ inputs.tag }}" ]; then
            TAGS="$TAGS,$REPO:${{ inputs.tag }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "pin=$PIN"   >> "$GITHUB_OUTPUT"
          echo "Building toolchain image for LLVM $PIN"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/llvm.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.pin }}

      - name: Summary
        run: |
          {
            echo "## Toolchain image published"
            echo
            echo "LLVM pin: \`${{ steps.tags.outputs.pin }}\`"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
